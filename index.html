<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- keep this out of search results: the URL is public, the page is not advertised -->
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#292F58">

<meta property="og:type" content="website">
<meta property="og:title" content="Weil Baseline — Player Development Platform">
<meta property="og:description" content="Every hour, every session, every point of improvement — in one place.">

<title>Weil Baseline — Player Development Platform</title>
<style>
/* ============================================================
   BRAND LAYER  ·  swap these five values for the academy's real
   hexes and the whole interface re-skins. Nothing else changes.
   ============================================================ */
:root{
  --brand:      #292F58;   /* Weil navy, sampled from the supplied logo */
  --brand-2:    #3A4276;   /* lighter steps of the same hue, for gradients */
  --brand-3:    #4E5794;
  --gold:       #F2A900;   /* accent — mine, not theirs. Change here to drop it. */
  --gold-2:     #FFC845;
  --gold-soft:  #FFF4DA;
}

:root{
  color-scheme: light;
  --surface-1:#ffffff; --page:#eef1f5; --surface-2:#f7f9fc;
  --text-primary:#0d1b2a; --text-secondary:#3d4a58; --muted:#6b7885;
  --grid:#dbe2ea; --baseline:#b3bfcc; --border:#d3dce6; --border-strong:#b9c6d4;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#006300; --success-bg:#00631a;
  --wash:rgba(11,42,74,0.05);
  --accent-soft:#dfe3f5;
  --shadow:0 1px 2px rgba(13,27,42,.06), 0 3px 10px rgba(13,27,42,.05);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#141a21; --page:#0a0e13; --surface-2:#1b232c;
  --text-primary:#ffffff; --text-secondary:#c8d2dd; --muted:#8b98a6;
  --grid:#2a343f; --baseline:#3c4854; --border:#2e3a46; --border-strong:#465464;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
  --success-text:#0ca30c; --success-bg:#0a7a24;
  --wash:rgba(255,255,255,0.07);
  --accent-soft:#3A4276;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 70px}

/* ---------- top bar ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(100deg,var(--brand) 0%,var(--brand-2) 62%,var(--brand-3) 100%);
  border-bottom:3px solid var(--gold);
}
.top-inner{max-width:1200px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand .mono{
  width:40px;height:40px;border-radius:11px;background:var(--gold);color:var(--brand);
  display:grid;place-items:center;font-size:22px;font-weight:800;flex:0 0 auto;letter-spacing:-.03em;
}
.brand h1{font-size:19px;margin:0;letter-spacing:-0.025em;font-weight:700;color:#fff;line-height:1.1}
.brand .motto{margin:3px 0 0;font-size:8.5px;font-weight:750;letter-spacing:.2em;color:var(--gold-2)}
.ctrls{display:flex;gap:10px;align-items:center}
.roles{display:flex;gap:3px;background:rgba(255,255,255,.13);padding:3px;border-radius:11px}
.roles button{
  border:0;background:transparent;color:rgba(255,255,255,.82);
  font:inherit;font-size:13px;font-weight:650;padding:7px 15px;border-radius:8px;cursor:pointer;
}
.roles button:hover{color:#fff;background:rgba(255,255,255,.10)}
.roles button[aria-pressed="true"]{background:var(--gold);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.icon-btn{
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;
  width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;
}
.icon-btn:hover{background:rgba(255,255,255,.2)}
@media(max-width:600px){ .roles button{padding:7px 11px;font-size:12.5px} .brand h1{font-size:17px} }

/* ---------- role banner ---------- */
.rolebar{background:var(--surface-1);border-bottom:1px solid var(--border)}
.rolebar-inner{max-width:1200px;margin:0 auto;padding:10px 20px;font-size:12.5px;color:var(--text-secondary);
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto;box-shadow:0 0 0 3px rgba(242,169,0,.22)}

/* ---------- cards ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:15px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card > h2{
  font-size:12.5px;margin:0 0 3px;letter-spacing:0.085em;text-transform:uppercase;
  color:var(--text-primary);font-weight:750;
}
.card > h2 .accentbar{display:inline-block;width:15px;height:3px;background:var(--gold);
  border-radius:2px;vertical-align:middle;margin-right:8px;position:relative;top:-1px}
.card > .sub{font-size:12.5px;color:var(--muted);margin:0 0 15px}
.grid{display:grid;gap:16px}
@media(min-width:880px){
  .g-2{grid-template-columns:1fr 1fr}
  .g-58{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .g-73{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}
}

/* ---------- player hero ---------- */
.hero-card{
  background:linear-gradient(115deg,var(--brand) 0%,var(--brand-2) 55%,var(--brand-3) 100%);
  border:0;color:#fff;padding:22px 24px;
}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{
  width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  background:var(--gold);color:var(--brand);font-size:23px;font-weight:750;flex:0 0 auto;
}
.phead .who h3{margin:0;font-size:25px;letter-spacing:-0.03em;color:#fff;font-weight:700}
.phead .who p{margin:4px 0 0;font-size:13.5px;color:rgba(255,255,255,.86);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hero-num{margin-left:auto;text-align:right}
.hero-num .label{font-size:10.5px;color:var(--gold-2);text-transform:uppercase;letter-spacing:0.12em;font-weight:750}
.hero-num .val{font-size:46px;font-weight:700;letter-spacing:-0.04em;line-height:1;color:#fff}

/* ---------- delta chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:750;
  padding:3px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.chip.up{background:var(--success-bg);color:#fff}
.chip.flat{background:var(--wash);color:var(--muted)}
.chip.down{background:var(--critical);color:#fff}
.chip.gold{background:var(--gold);color:var(--brand)}
.hero-card .chip.flat{background:rgba(255,255,255,.2);color:#fff}

/* ---------- TIME INVESTED band ---------- */
.time-band{
  background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 100%);
  border-radius:15px;padding:22px 24px;margin-bottom:16px;color:#fff;box-shadow:var(--shadow);
}
.time-band .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:750;margin:0 0 3px}
.time-band .headline{font-size:15.5px;margin:0 0 18px;color:rgba(255,255,255,.92);line-height:1.45}
.time-band .headline b{color:var(--gold-2);font-size:19px;font-weight:750;letter-spacing:-.02em}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:700px){.tgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.tgrid{grid-template-columns:repeat(6,1fr)}}
.ttile{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);border-radius:12px;padding:13px 14px}
.ttile .v{font-size:29px;font-weight:750;letter-spacing:-.035em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.ttile .v small{font-size:14px;font-weight:650;color:rgba(255,255,255,.65);letter-spacing:0}
.ttile .t{font-size:11px;color:rgba(255,255,255,.80);margin-top:6px;line-height:1.3;font-weight:550}
.ttile .d{margin-top:8px}
.ttile .chip.up{background:var(--gold);color:var(--brand)}
.ttile .chip.flat{background:rgba(255,255,255,.18);color:rgba(255,255,255,.9)}

/* ---------- stat tiles (light) ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:11px}
.tile{border:1px solid var(--border);border-radius:12px;padding:13px 15px;background:var(--surface-2)}
.tile .t{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;font-weight:700}
.tile .v{font-size:26px;font-weight:730;letter-spacing:-0.03em;line-height:1.1;color:var(--brand)}
:root[data-theme="dark"] .tile .v{color:#dfe3f5}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600}
.tile .n{font-size:11.5px;color:var(--text-secondary);margin-top:5px}

/* ---------- gains strip ---------- */
.gains{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.gain{
  border:1.5px solid var(--success-bg);border-radius:11px;padding:9px 13px;background:var(--surface-1);
  display:flex;flex-direction:column;gap:2px;
}
.gain .g-v{font-size:23px;font-weight:750;color:var(--success-text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gain .g-l{font-size:11px;color:var(--text-secondary);font-weight:600}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3.5px 10px;border-radius:999px;white-space:nowrap;
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-primary);
}
.hero-card .badge{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.badge .bd{width:8px;height:8px;border-radius:50%}
.b-good .bd{background:var(--good)} .b-warning .bd{background:var(--warning)}
.b-serious .bd{background:var(--serious)} .b-critical .bd{background:var(--critical)}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--text-secondary);font-size:11px;font-variant-numeric:tabular-nums;font-weight:500}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--baseline);stroke-width:1.5}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--brand);color:#fff;border-radius:9px;
  padding:8px 12px;font-size:12.5px;box-shadow:0 5px 18px rgba(0,0,0,.28);z-index:20;white-space:nowrap;
}
.tip b{font-size:14px;color:var(--gold-2)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 13px;font-size:12.5px;color:var(--text-secondary);font-weight:550}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

/* stacked hours bar */
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack div{display:grid;place-items:center;font-size:11.5px;font-weight:750;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;overflow:hidden}

/* ---------- skill rows ---------- */
.skill{margin-bottom:14px}
.skill .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;align-items:center;gap:8px}
.skill .lab .nm{font-weight:600}
.skill .lab b{font-variant-numeric:tabular-nums;font-weight:750;font-size:14px}
.track{position:relative;height:21px}
.track .bar{position:absolute;height:8px;border-radius:4px}
.track .b1{top:0;background:var(--series-1)}
.track .b2{top:11px;background:var(--series-2)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);
  font-weight:750;padding:0 10px 10px;border-bottom:2px solid var(--border-strong);white-space:nowrap;
}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--wash)}
.tname{display:flex;align-items:center;gap:10px}
.mini{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--gold);
  display:grid;place-items:center;font-size:11.5px;font-weight:750;flex:0 0 auto}
.tname .sub{font-size:11.5px;color:var(--muted)}
.scroll{overflow-x:auto}
.mini-table{font-size:12.5px}
.mini-table td{padding:7px 10px}

/* ---------- notes & thread ---------- */
.note{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin-bottom:16px}
.note .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600}
.note p{margin:0;font-size:14px;color:var(--text-secondary)}
.msg{display:flex;gap:12px;margin-bottom:16px}
.msg .mini{width:34px;height:34px;font-size:12.5px}
.msg.parent .mini{background:var(--series-2);color:#fff}
.msg.student .mini{background:var(--series-3);color:#fff}
.msg .body{flex:1;min-width:0}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.msg .meta b{color:var(--text-primary);font-size:13px}
.msg p{margin:0;font-size:14px;color:var(--text-secondary);white-space:pre-wrap}
.composer{display:flex;gap:10px;margin-top:8px}
textarea,input[type=text],select{
  font:inherit;background:var(--surface-1);color:var(--text-primary);
  border:1.5px solid var(--border-strong);border-radius:10px;padding:10px 12px;width:100%;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2.5px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
.btn{
  border:0;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:13.5px;
  padding:10px 19px;border-radius:10px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--brand-2)}
.btn.gold{background:var(--gold);color:var(--brand)}
.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;color:var(--text-primary);border:1.5px solid var(--border-strong)}
.btn.ghost:hover{background:var(--wash)}

/* ---------- goals ---------- */
.goal{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}
.goal:last-child{border-bottom:0}
.goal .g-body{flex:1;min-width:0}
.goal h4{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.goal p{margin:0;font-size:13px;color:var(--text-secondary)}

/* ---------- sliders ---------- */
.slider-row{display:grid;grid-template-columns:98px 1fr 36px;gap:12px;align-items:center;margin-bottom:12px}
.slider-row label{font-size:13px;color:var(--text-secondary);font-weight:600}
.slider-row output{font-size:14px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums;color:var(--brand)}
:root[data-theme="dark"] .slider-row output{color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--brand)}
:root[data-theme="dark"] input[type=range]{accent-color:var(--gold)}

.callout{
  background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 11px 11px 0;
  padding:14px 16px;font-size:14px;color:var(--text-primary);margin-bottom:15px;font-weight:500;
}
:root[data-theme="dark"] .callout{background:rgba(242,169,0,.13)}
.pill-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.selwrap{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary);
  margin-bottom:15px;font-weight:600}
.selwrap select{width:auto;min-width:220px;padding:8px 11px;font-size:13.5px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:10px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" id="brandSlot"></div>
    <div class="ctrls">
      <div class="roles" role="group" aria-label="Switch role">
        <button data-role="parent" aria-pressed="true">Parent</button>
        <button data-role="student" aria-pressed="false">Student</button>
        <button data-role="coach" aria-pressed="false">Coach</button>
        <button data-role="admin" aria-pressed="false">Director</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark mode">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 000 17z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="rolebar"><div class="rolebar-inner"><span class="dot"></span><span id="rolebarText"></span></div></div>

<div class="wrap">
  <main id="view"></main>
  <p class="foot">Weil Baseline · prototype · accent colour is a placeholder · all players, scores and messages are fictional sample data</p>
</div>

<script>
"use strict";

/* ============================================================
   LOGO SLOT
   The Weil mark, keyed to transparent white and inlined as a data URI
   so this file works offline. Replace the string to swap the logo;
   set it to null to fall back to a plain monogram. LOGO_H is the

const byId=id=>PLAYERS.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=p=>p.first[0]+p.last[0];
const utrDelta=p=>+(p.utr[p.utr.length-1]-p.utr[0]).toFixed(1);
const attendance=p=>Math.round(p.sessions/p.scheduled*100);
const skillAvg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const matches=p=>p.wins+p.losses;

/* hours per bucket, forced to sum exactly to p.hours */
function buckets(p){
  const raw=p.mix.map(m=>p.hours*m);
  const out=raw.map(v=>Math.round(v));
  out[0]+=p.hours-out.reduce((a,b)=>a+b,0);
  return BUCKETS.map((b,i)=>({...b, v:out[i]}));
}
/* monthly hours: shared seasonal shape, per-player phase jitter, sums to p.hours */
function monthly(p){
  const seed=p.id.charCodeAt(0)+p.id.charCodeAt(1);
  const w=SEASON.map((s,i)=>s*(1+0.16*Math.sin(seed+i*1.7)));
  const tot=w.reduce((a,b)=>a+b,0);
  const out=w.map(x=>Math.round(p.hours*x/tot));
  out[out.length-1]+=p.hours-out.reduce((a,b)=>a+b,0);
  return out;
}

/* `flatBand` — movement smaller than this reads as "no change", not progress.
   A UTR gain of +0.1 across a full year is a plateau; painting it green lies. */
function chip(d,{suffix="",flatBand=0.05,dp=1,gold=false}={}){
  const cls=d>flatBand?(gold?"gold":"up"):d<-flatBand?"down":"flat";
  const arrow=d>flatBand?"▲":d<-flatBand?"▼":"—";
  return `<span class="chip ${cls}">${arrow} ${d>0?"+":""}${d.toFixed(dp)}${suffix}</span>`;
}
const utrChip=(p,gold=false)=>chip(utrDelta(p),{flatBand:UTR_FLAT,gold});
function badge(status,label){
  return `<span class="badge b-${status}"><span class="bd"></span>${esc(label||STATUS_LABEL[status])}</span>`;
}

/* ============================================================
   CHARTS
   ============================================================ */
const isNarrow=()=>window.innerWidth<720;

/* Line — single series (UTR). No legend: the title names it. */
function lineChart(p,{h=215}={}){
  const W=isNarrow()?380:(h>260?560:660), H=isNarrow()?235:h, m={t:16,r:22,b:26,l:36};
  const iw=W-m.l-m.r, ih=H-m.t-m.b, vals=p.utr;
  const lo=Math.floor((Math.min(...vals)-.35)*2)/2, hi=Math.ceil((Math.max(...vals)+.35)*2)/2;
  const x=i=>m.l+iw*i/(vals.length-1), y=v=>m.t+ih-((v-lo)/(hi-lo))*ih;
  let g="",ax="";
  for(let v=lo;v<=hi+1e-9;v+=.5){const t=+v.toFixed(1);
    g+=`<line class="gridline" x1="${m.l}" y1="${y(t).toFixed(1)}" x2="${W-m.r}" y2="${y(t).toFixed(1)}"/>`;
    ax+=`<text x="${m.l-8}" y="${(y(t)+3.7).toFixed(1)}" text-anchor="end">${t.toFixed(1)}</text>`;}
  const every=isNarrow()?3:2;
  MONTHS.forEach((mo,i)=>{if(i%every===0||i===MONTHS.length-1)
    ax+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${mo}</text>`;});
  const d=vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const uid="lg"+p.id;
  const hits=vals.map((v,i)=>`<g class="hit" data-i="${i}" data-v="${v}"><rect x="${(x(i)-iw/(vals.length-1)/2).toFixed(1)}" y="${m.t}" width="${(iw/(vals.length-1)).toFixed(1)}" height="${ih}" fill="transparent"/></g>`).join("");
  return `<div class="chart" data-chart="line">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="UTR from September to August, ${vals[0]} to ${vals[vals.length-1]}">
      <defs><linearGradient id="${uid}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="var(--series-1)" stop-opacity="0.24"/>
        <stop offset="100%" stop-color="var(--series-1)" stop-opacity="0"/></linearGradient></defs>
      ${g}<line class="axisline" x1="${m.l}" y1="${m.t+ih}" x2="${W-m.r}" y2="${m.t+ih}"/>
      <path d="${d} L${x(vals.length-1).toFixed(1)},${m.t+ih} L${m.l},${m.t+ih} Z" fill="url(#${uid})"/>
      <path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="cur" r="5.5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2.5" opacity="0"/>
      <circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2.5"/>
      <g class="axis">${ax}</g>${hits}
    </svg><div class="tip"></div></div>`;
}

/* Columns — monthly training hours. One series, so no legend. */
function hoursChart(p){
  const data=monthly(p);
  const W=isNarrow()?380:660, H=isNarrow()?210:200, m={t:20,r:14,b:26,l:34};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const hi=Math.ceil(Math.max(...data)/10)*10;
  const bw=iw/data.length*0.66, step=iw/data.length;
  const y=v=>m.t+ih-(v/hi)*ih;
  let g="",ax="";
  for(let t=0;t<=hi;t+=hi/4){
    g+=`<line class="gridline" x1="${m.l}" y1="${y(t).toFixed(1)}" x2="${W-m.r}" y2="${y(t).toFixed(1)}"/>`;
    ax+=`<text x="${m.l-8}" y="${(y(t)+3.7).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;}
  let bars="";
  data.forEach((v,i)=>{
    const cx=m.l+step*i+step/2, bh=Math.max(3,ih-(y(v)-m.t));
    bars+=`<g class="hit" data-i="${i}" data-v="${v}">
      <rect x="${(cx-step/2).toFixed(1)}" y="${m.t}" width="${step.toFixed(1)}" height="${ih}" fill="transparent"/>
      <rect x="${(cx-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="var(--series-1)"/></g>`;
    if(i%(isNarrow()?3:1)===0||i===data.length-1)
      ax+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle">${MONTHS[i]}</text>`;
  });
  return `<div class="chart" data-chart="bars">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Training hours per month, September to August">
      ${g}<line class="axisline" x1="${m.l}" y1="${m.t+ih}" x2="${W-m.r}" y2="${m.t+ih}"/>
      ${bars}<g class="axis">${ax}</g>
    </svg><div class="tip"></div></div>`;
}

/* Stacked hours bar + a value table — the table is the required relief for
   the segments that sit below 3:1 contrast on a light surface. */
function hoursStack(p){
  const b=buckets(p), tot=p.hours;
  const segs=b.map(s=>`<div style="flex:${s.v};background:${s.c}" title="${esc(s.label)}">${s.v/tot>0.11?s.v+"h":""}</div>`).join("");
  const rows=b.map(s=>`<tr>
      <td><span class="swatch" style="display:inline-block;background:${s.c};margin-right:8px"></span>${esc(s.label)}</td>
      <td class="num"><b>${s.v}</b> h</td>
      <td class="num" style="color:var(--muted)">${Math.round(s.v/tot*100)}%</td></tr>`).join("");
  return `<div class="stack">${segs}</div>
    <table class="mini-table"><tbody>${rows}
      <tr><td style="font-weight:750;border-top:2px solid var(--border-strong)">Total on-site hours</td>
          <td class="num" style="font-weight:750;border-top:2px solid var(--border-strong)">${tot} h</td>
          <td class="num" style="border-top:2px solid var(--border-strong)"></td></tr></tbody></table>`;
}

/* Grouped bars — 2 series, legend + a direct label on every row. */
function skillBars(p){
  const rows=SKILLS.map((s,i)=>{
    const a=p.skillsStart[i], b=p.skillsNow[i];
    return `<div class="skill">
      <div class="lab"><span class="nm">${s}</span><span><b>${b.toFixed(1)}</b><span style="color:var(--muted)"> / 10</span> &nbsp;${chip(+(b-a).toFixed(1))}</span></div>
      <div class="track"><div class="bar b1" style="width:${b*10}%"></div><div class="bar b2" style="width:${a*10}%"></div></div>
    </div>`;}).join("");
  return `<div class="legend">
      <span><i class="swatch" style="background:var(--series-1)"></i>Now (Aug)</span>
      <span><i class="swatch" style="background:var(--series-2)"></i>Baseline (Sep)</span></div>${rows}`;
}

/* Dot plot — UTR change by player. One series, direct labels on both arms. */
function movementChart(){
  const data=[...PLAYERS].map(p=>({p,d:utrDelta(p)})).sort((a,b)=>b.d-a.d);
  const W=660, rowH=40, H=data.length*rowH+38, m={t:12,r:56,b:26,l:112};
  const iw=W-m.l-m.r, max=Math.max(1.8,...data.map(d=>Math.abs(d.d)));
  const lo=-max*.35, hi=max, x=v=>m.l+((v-lo)/(hi-lo))*iw;
  let g="",ax="";
  [-0.5,0,0.5,1,1.5].filter(t=>t>=lo&&t<=hi).forEach(t=>{
    g+=`<line class="${t===0?"axisline":"gridline"}" x1="${x(t).toFixed(1)}" y1="${m.t}" x2="${x(t).toFixed(1)}" y2="${H-m.b}"/>`;
    ax+=`<text x="${x(t).toFixed(1)}" y="${H-7}" text-anchor="middle">${t>0?"+":""}${t}</text>`;});
  let marks="";
  data.forEach((d,i)=>{
    const cy=m.t+i*rowH+rowH/2, neg=d.d<0;
    const col=d.d>=0.9?"var(--good)":d.d>=UTR_FLAT?"var(--series-1)":d.d>-UTR_FLAT?"var(--warning)":"var(--critical)";
    marks+=`<text x="${m.l-12}" y="${cy+4}" text-anchor="end" fill="var(--text-secondary)" font-size="12.5">${esc(d.p.first)} ${esc(d.p.last[0])}.</text>
      <line x1="${x(0).toFixed(1)}" y1="${cy}" x2="${x(d.d).toFixed(1)}" y2="${cy}" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <circle cx="${x(d.d).toFixed(1)}" cy="${cy}" r="6" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>
      <text x="${(x(d.d)+(neg?-14:14)).toFixed(1)}" y="${cy+4.5}" text-anchor="${neg?"end":"start"}" font-size="12.5" font-weight="700" fill="var(--text-primary)" style="font-variant-numeric:tabular-nums">${d.d>0?"+":""}${d.d.toFixed(1)}</text>`;});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="UTR change over the year by player">${g}${marks}<g class="axis">${ax}</g></svg></div>`;
}

/* Columns — enrolment by year against capacity. One series; the capacity
   rule is labelled directly so it never needs a legend. */
function enrolChart(){
  const W=660,H=250,m={t:26,r:16,b:34,l:36};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const hi=Math.ceil(CAPACITY/10)*10;
  const step=iw/ENROLMENT.length, bw=step*0.54;
  const y=v=>m.t+ih-(v/hi)*ih;
  let g="",ax="";
  for(let t=0;t<=hi;t+=hi/4){
    g+=`<line class="gridline" x1="${m.l}" y1="${y(t).toFixed(1)}" x2="${W-m.r}" y2="${y(t).toFixed(1)}"/>`;
    ax+=`<text x="${m.l-8}" y="${(y(t)+3.7).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;}
  let bars="";
  ENROLMENT.forEach((e,i)=>{
    const cx=m.l+step*i+step/2, top=y(e.n), last=i===ENROLMENT.length-1;
    // label inside the bar: above it, the tallest column collides with the capacity rule
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${(m.t+ih-top).toFixed(1)}"
             rx="5" fill="var(--series-1)"/>
      ${last?`<rect x="${(cx-bw/2).toFixed(1)}" y="${(top-6).toFixed(1)}" width="${bw.toFixed(1)}" height="4" rx="2" fill="var(--gold)"/>`:""}
      <text x="${cx.toFixed(1)}" y="${(top+20).toFixed(1)}" text-anchor="middle" font-size="13.5" font-weight="750"
            fill="#fff" style="font-variant-numeric:tabular-nums">${e.n}</text>`;
    ax+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-weight="${last?750:500}">${e.y}</text>`;
  });
  const cy=y(CAPACITY);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Enrolment by year against a capacity of ${CAPACITY}">
    ${g}
    <line x1="${m.l}" y1="${cy.toFixed(1)}" x2="${W-m.r}" y2="${cy.toFixed(1)}" stroke="var(--critical)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="${W-m.r}" y="${(cy-7).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--critical)">Capacity ${CAPACITY}</text>
    <line class="axisline" x1="${m.l}" y1="${m.t+ih}" x2="${W-m.r}" y2="${m.t+ih}"/>
    ${bars}<g class="axis">${ax}</g></svg></div>`;
}

/* Horizontal bars — students by country. One series, every bar directly labelled. */
function countryChart(){
  const d=[...COUNTRIES].sort((a,b)=>b.n-a.n);
  const rowH=27, W=660, H=d.length*rowH+16, m={l:118,r:44};
  const iw=W-m.l-m.r, max=Math.max(...d.map(x=>x.n));
  let out="";
  d.forEach((x,i)=>{
    const cy=8+i*rowH+rowH/2, w=Math.max(3,iw*x.n/max);
    out+=`<text x="${m.l-12}" y="${cy+4.5}" text-anchor="end" font-size="12.5" fill="var(--text-secondary)">${esc(x.c)}</text>
      <rect x="${m.l}" y="${cy-8}" width="${w.toFixed(1)}" height="16" rx="4" fill="var(--series-1)"/>
      <text x="${(m.l+w+9).toFixed(1)}" y="${cy+4.5}" font-size="12.5" font-weight="700" fill="var(--text-primary)"
            style="font-variant-numeric:tabular-nums">${x.n}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number of students by country of origin">${out}</svg></div>`;
}

/* Retention by country — a table, because three measures across twelve
   categories is a table, not a chart. Worst retention first. */
function retentionTable(){
  const d=[...COUNTRIES].sort((a,b)=>a.ret-b.ret||b.n-a.n);
  const band=r=>r>=85?"good":r>=70?"warning":r>=60?"serious":"critical";
  return `<div class="scroll"><table>
    <thead><tr><th>Country</th><th class="num">Students</th><th class="num">Share</th>
      <th class="num">Avg years enrolled</th><th class="num">Year-on-year retention</th></tr></thead>
    <tbody>${d.map(x=>`<tr>
      <td style="font-weight:600">${esc(x.c)}</td>
      <td class="num">${x.n}</td>
      <td class="num" style="color:var(--muted)">${Math.round(x.n/ROSTER_N*100)}%</td>
      <td class="num">${x.yrs.toFixed(1)}</td>
      <td class="num">${badge(band(x.ret), x.ret+"%")}</td></tr>`).join("")}</tbody></table></div>`;
}

function ring(pct,size=36){
  const r=(size-5)/2, c=2*Math.PI*r;
  const col=pct>=75?"var(--good)":pct>=45?"var(--series-1)":pct>=25?"var(--warning)":"var(--critical)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct} percent" style="flex:0 0 auto">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+3.8}" text-anchor="middle" font-size="10.5" font-weight="750" fill="var(--text-primary)">${pct}</text></svg>`;
}

function playerHero(p){
  return `<div class="card hero-card"><div class="phead">
    <div class="avatar">${initials(p)}</div>
    <div class="who"><h3>${esc(p.first)} ${esc(p.last)}</h3>
      <p><span>Grade ${p.grade}</span><span>·</span><span>${esc(p.country)}</span><span>·</span>
         <span>Coach ${esc(p.coach)}</span>${badge(p.status,p.statusLabel)}</p></div>
    <div class="hero-num"><div class="label">UTR rating</div>
      <div class="val">${p.utr[p.utr.length-1].toFixed(1)}</div>
      <div style="margin-top:6px">${utrChip(p,true)} <span style="color:rgba(255,255,255,.7);font-size:12.5px">this year</span></div></div>
  </div></div>`;
}

function timeBand(p){
  const b=buckets(p), priv=b[1].v, fit=b[3].v;
  const pv=p.prev, first=!pv.hours;
  const d=(now,was)=>first?"":chip(now-was,{dp:0,flatBand:0.5});
  // last year's bucket hours, so every tile carries the same year-on-year cue
  const prevB=i=>Math.round(pv.hours*p.mix[i]);
  const t=(v,unit,label,delta)=>`<div class="ttile">
      <div class="v">${v}${unit?`<small>${unit}</small>`:""}</div>
      <div class="t">${label}</div>${delta?`<div class="d">${delta}</div>`:""}</div>`;
  return `<div class="time-band">
    <p class="eyebrow">Time invested · 2025–26</p>
    <p class="headline">Since September, ${esc(p.first)} has spent <b>${p.hours} hours</b> on court and in the gym at Weil —
      ${first?"his first full year with us.":`${Math.abs(p.hours-pv.hours)} hours ${p.hours>=pv.hours?"more":"fewer"} than last year.`}</p>
    <div class="tgrid">
      ${t(p.hours,"h","Total training hours",d(p.hours,pv.hours))}
      ${t(p.sessions,"","Days of training",d(p.sessions,pv.sessions))}
      ${t(Math.round(priv/1.5),"",`One-to-one lessons (${priv} h)`,d(Math.round(priv/1.5),Math.round(prevB(1)/1.5)))}
      ${t(fit,"h","Strength & conditioning",d(fit,prevB(3)))}
      ${t(matches(p),"","Matches played",d(matches(p),pv.matches))}
      ${t(p.tournaments,"","Tournaments entered",d(p.tournaments,pv.tournaments))}
    </div></div>`;
}

function gainsStrip(p){
  const g=[
    {v:utrDelta(p),l:"UTR rating",dp:1},
    {v:+(skillAvg(p.skillsNow)-skillAvg(p.skillsStart)).toFixed(1),l:"Technical average",dp:1},
    {v:p.fitness-p.fitnessStart,l:"Fitness score",dp:0},
    {v:p.vsHigher,l:"Wins vs higher-rated",dp:0,raw:true}
  ];
  return `<div class="gains">${g.map(x=>`<div class="gain">
      <span class="g-v">${x.raw?"":(x.v>0?"+":"")}${x.v.toFixed(x.dp)}</span>
      <span class="g-l">${x.l}</span></div>`).join("")}</div>`;
}

function threadBlock(p){
  const msgs=p.thread.length?p.thread.map(m=>`<div class="msg ${m.who}">
      <div class="mini">${esc(m.n.split(" ").map(w=>w[0]).slice(0,2).join(""))}</div>
      <div class="body"><div class="meta"><b>${esc(m.n)}</b> · ${esc(m.r)} · ${esc(m.d)}</div><p>${esc(m.t)}</p></div></div>`).join("")
    :`<p style="color:var(--muted);font-size:13.5px;margin:0 0 10px">No messages yet for this player.</p>`;
  return `<div class="card"><h2><span class="accentbar"></span>Conversation</h2>
    <p class="sub">Coaches, parents and the player in one thread per student — not scattered across email and WhatsApp.</p>
    <div id="thread">${msgs}</div>
    <div class="composer"><textarea id="msgBox" rows="2" placeholder="Write a message…"></textarea>
      <button class="btn gold" id="sendBtn">Send</button></div></div>`;
}

function playerSelect(current){
  return `<div class="selwrap"><label for="pSel">Viewing</label>
    <select id="pSel">${PLAYERS.map(p=>`<option value="${p.id}"${p.id===current?" selected":""}>${esc(p.first)} ${esc(p.last)} · Gr ${p.grade} · UTR ${p.utr[p.utr.length-1].toFixed(1)}</option>`).join("")}</select></div>`;
}

      <div class="callout" style="margin:14px 0 0">

/* ============================================================
   RENDER
   ============================================================ */
const ROLE_TEXT={
  parent:"Parent view — what a family in São Paulo or Seoul opens on a Friday morning.",
  student:"Student view — the player's own hours, goals and scores.",
  coach:"Coach view — roster triage, then ninety seconds of input per session.",
  admin:"Director view — retention risk, hours delivered and rating movement across the academy."
};

function render(){
  $("#rolebarText").textContent=ROLE_TEXT[state.role];
  $("#view").innerHTML = state.role==="parent"?parentView()
    : state.role==="student"?studentView()
    : state.role==="coach"?coachView() : adminView();
  wire();
  window.scrollTo({top:0,behavior:"instant"});
}

function wire(){
  const sel=$("#pSel");
  if(sel) sel.addEventListener("change",e=>{state.playerId=e.target.value;render();});

  document.querySelectorAll("[data-pick]").forEach(row=>row.addEventListener("click",()=>{
    state.playerId=row.dataset.pick;
    if(state.role==="admin"){state.role="coach";syncRoleButtons();}
    render();
  }));

  document.querySelectorAll("#sliders input[type=range]").forEach(r=>
    r.addEventListener("input",()=>{r.nextElementSibling.textContent=(+r.value).toFixed(1);}));

  const save=$("#saveNote");
  if(save) save.addEventListener("click",()=>{
    const box=$("#noteBox"), txt=box.value.trim(); if(!txt) return;
    const p=byId(state.playerId);
    SKILLS.forEach((s,i)=>{p.skillsNow[i]=+$("#sl"+i).value;});
    p.notes.unshift({d:"Today",by:"Mohamed Badran",t:txt});
    box.value=""; render();
  });

  const send=$("#sendBtn");
  if(send) send.addEventListener("click",()=>{
    const box=$("#msgBox"), txt=box.value.trim(); if(!txt) return;
    const p=byId(state.playerId);
    const me=state.role==="student"?{who:"student",n:p.first,r:"Player"}
      :state.role==="parent"?{who:"parent",n:"You",r:"Parent"}
      :{who:"coach",n:"You",r:state.role==="admin"?"Academy Director":"Coach"};
    p.thread.push({...me,d:"Just now",t:txt});
    box.value=""; render();
  });

  document.querySelectorAll('[data-chart]').forEach(setupTip);
}

function setupTip(root){
  const svg=root.querySelector("svg"), tip=root.querySelector(".tip");
  const cur=root.querySelector(".cur");
  const kind=root.dataset.chart;
  const path=kind==="line"?svg.querySelectorAll("path")[1]:null;
  root.querySelectorAll(".hit").forEach(h=>{
    h.addEventListener("mouseenter",()=>{
      const i=+h.dataset.i, v=+h.dataset.v;
      const box=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
      const sx=box.width/vb.width, sy=box.height/vb.height;
      let px,py;
      if(kind==="line"){
        // recover the vertex from the path's own d attribute
        const d=path.getAttribute("d").split(" ")[i].replace(/^[ML]/,"").split(",");
        px=+d[0]; py=+d[1];
        cur.setAttribute("cx",px); cur.setAttribute("cy",py); cur.setAttribute("opacity","1");
        tip.innerHTML=`<b>${v.toFixed(1)}</b> UTR<br><span style="opacity:.75">${MONTHS[i]}</span>`;
      }else{
        const bar=h.querySelectorAll("rect")[1];
        px=+bar.getAttribute("x")+ +bar.getAttribute("width")/2; py=+bar.getAttribute("y");
        tip.innerHTML=`<b>${v}</b> hours<br><span style="opacity:.75">${MONTHS[i]}</span>`;
      }
      tip.style.opacity="1";
      const tw=tip.offsetWidth;
      tip.style.left=Math.max(0,Math.min(box.width-tw,px*sx-tw/2))+"px";
      tip.style.top=Math.max(0,py*sy-tip.offsetHeight-12)+"px";
    });
  });
  root.addEventListener("mouseleave",()=>{
    tip.style.opacity="0";
    if(cur) cur.setAttribute("opacity","0");
  });
}

function syncRoleButtons(){
  document.querySelectorAll(".roles button").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.role===state.role)));
}
document.querySelectorAll(".roles button").forEach(b=>
  b.addEventListener("click",()=>{state.role=b.dataset.role;syncRoleButtons();render();}));
$("#themeBtn").addEventListener("click",()=>{
  const c=document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark");
});

/* re-render only when the layout crosses the narrow breakpoint */
let wasNarrow=isNarrow();
window.addEventListener("resize",()=>{ if(isNarrow()!==wasNarrow){wasNarrow=isNarrow();render();} });

$("#brandSlot").innerHTML = brandMark();
render();
</script>
